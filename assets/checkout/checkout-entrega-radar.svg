    <text x="82" y="149" fill="#102d3b" font-size="48" font-weight="800">Tudo para sair da teoria</text>
    <text x="82" y="206" fill="#102d3b" font-size="48" font-weight="800">e entrar em movimento.</text>
    <g transform="translate(82 262)"><rect width="710" height="90" rx="17" fill="#ffffff" stroke="#cfe2d5"/><circle cx="48" cy="45" r="22" fill="#e0f8ec"/><path d="M37 45l7 7 14-18" stroke="#168267" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="86" y="39" fill="#102d3b" font-size="23" font-weight="800">Curso completo, passo a passo</text><text x="86" y="67" fill="#627974" font-size="17">Da busca até a preparação para o trabalho.</text></g>
    <g transform="translate(82 370)"><rect width="710" height="90" rx="17" fill="#ffffff" stroke="#cfe2d5"/><circle cx="48" cy="45" r="22" fill="#e0f8ec"/><path d="M37 45l7 7 14-18" stroke="#168267" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="86" y="39" fill="#102d3b" font-size="23" font-weight="800">Caderno online + PDF + exercícios</text><text x="86" y="67" fill="#627974" font-size="17">Organize o perfil, as candidaturas e os recebimentos.</text></g>
    <g transform="translate(82 478)"><rect width="710" height="90" rx="17" fill="#ffffff" stroke="#cfe2d5"/><circle cx="48" cy="45" r="22" fill="#e0f8ec"/><path d="M37 45l7 7 14-18" stroke="#168267" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="86" y="39" fill="#102d3b" font-size="23" font-weight="800">30 dias de Radar incluídos</text><text x="86" y="67" fill="#627974" font-size="17">Comece encontrando oportunidades em um só lugar.</text></g>
    <g transform="translate(858 72)" filter="url(#shadow)">
