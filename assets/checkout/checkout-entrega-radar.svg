      <text x="48" y="207" fill="#f4fff9" font-size="40" font-weight="800">Continue com o Radar.</text>
      <text x="48" y="273" fill="#a9cbc5" font-size="25" font-weight="700">12 MESES TOTAIS DE ACESSO</text>
