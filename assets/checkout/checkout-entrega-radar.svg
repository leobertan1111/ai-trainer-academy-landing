      <text x="48" y="457" fill="#e5f5f0" font-size="24" font-weight="800">+11 MESES ALÉM DOS 30 DIAS INCLUÍDOS</text>
      <text x="48" y="497" fill="#9fc2bb" font-size="20">Menos de R$13/mês  ·  pagamento único  ·  sem renovação</text>
