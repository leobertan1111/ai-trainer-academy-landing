      <g transform="translate(0 84)"><circle cx="18" cy="18" r="18" fill="#1d8a6d"/><path d="M9 18l6 6 12-15" stroke="white" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="52" y="14" fill="#102d3b" font-size="23" font-weight="800">Caderno online + PDF</text><text x="52" y="42" fill="#58706f" font-size="18">Organize perfil, candidaturas e recebimentos.</text></g>
