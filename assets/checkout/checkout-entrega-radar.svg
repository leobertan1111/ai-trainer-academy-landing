    <g transform="translate(82 623)"><circle cx="18" cy="18" r="18" fill="#157a62"/><path d="M10 18l5 5 11-14" stroke="white" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="52" y="25" fill="#345d53" font-size="20" font-weight="800">7 dias de garantia</text><circle cx="325" cy="18" r="18" fill="#157a62"/><path d="M317 18l5 5 11-14" stroke="white" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="359" y="25" fill="#345d53" font-size="20" font-weight="800">Compra protegida pela Cakto</text><text x="953" y="25" fill="#647c75" font-size="17">A extensão só é adicionada se você selecionar a oferta.</text></g>
