      <g transform="translate(42 91)"><circle cx="28" cy="28" r="27" fill="#7df0ce"/><text x="28" y="36" text-anchor="middle" fill="#07352f" font-size="23" font-weight="900">1</text><text x="82" y="20" fill="#f1fff9" font-size="27" font-weight="800">Encontre</text><text x="82" y="52" fill="#96b9b6" font-size="20">fontes e projetos compatíveis</text></g>
