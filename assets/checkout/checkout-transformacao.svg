      <g transform="translate(42 331)"><circle cx="28" cy="28" r="27" fill="#184b45" stroke="#7df0ce" stroke-opacity=".65"/><text x="28" y="36" text-anchor="middle" fill="#8cefd3" font-size="23" font-weight="900">3</text><text x="82" y="20" fill="#f1fff9" font-size="27" font-weight="800">Prepare-se</text><text x="82" y="52" fill="#96b9b6" font-size="20">para executar e receber</text></g>
